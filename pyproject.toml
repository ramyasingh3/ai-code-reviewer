[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-reviewer"
version = "0.1.0"
description = "PR review agent with tool-style diff analysis and eval fixtures"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ramya Singh" }]

[project.scripts]
ai-review = "ai_code_reviewer.review:main"

[tool.setuptools.packages.find]
where = ["src"]
