name: ci

on:
  push:
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run eval suite
        run: |
          export PYTHONPATH=src
          python3 -m ai_code_reviewer eval --fixtures evals/fixtures
